name: V2 renderer

on:
  pull_request:
    paths:
      - ".github/workflows/v2-renderer.yml"
      - "apps/v2/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/v2-renderer.yml"
      - "apps/v2/**"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/v2
    env:
      VGPU_ADAPTER: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/v2/package-lock.json
      - run: npm ci
      - run: npm exec vgpu install-software-renderer
      - run: npm run check
      - run: npm run render:scene -- --scene spike --profile output --size 640x360 --time 1.25 --out artifacts/dynamic-lighting.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-renderer-artifacts
          path: apps/v2/artifacts/
