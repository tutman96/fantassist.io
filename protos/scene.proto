syntax = "proto3";

message Scene {
  string id = 1;
  string name = 2;
  uint64 version = 3;
  TableOptions table = 4;
  repeated Layer layers = 5;
}

message TableOptions {
  bool displayGrid = 1;
  Vector2d offset = 2;
  double rotation = 3;
  double scale = 4;
}

message Vector2d {
  double x = 1;
  double y = 2;
}

message Size {
  double width = 1;
  double height = 2;
}

message Layer {
  reserved 3;

  oneof layerType {
    AssetLayer assetLayer = 1;
    FogLayer fogLayer = 2;
    EffectsLayer effectsLayer = 4;
  }
  enum LayerType {
    ASSETS = 0;
    FOG = 1;
    reserved 2;
    EFFECTS = 3;
  }
}

message AssetLayer {
  string id = 1;
  string name = 3;
  bool visible = 4;
  Layer.LayerType type = 5;

  map<string, Asset> assets = 6;
  message Asset {
    string id = 1;

    AssetType type = 2;
    enum AssetType {
      IMAGE = 0;
      VIDEO = 1;
    }

    Size size = 3;

    AssetTransform transform = 4;
    message AssetTransform {
      double x = 1;
      double y = 2;
      double rotation = 3;
      double width = 4;
      double height = 5;
    }

    optional AssetCalibration calibration = 5;
    message AssetCalibration {
      float xOffset = 1;
      float yOffset = 2;
      float ppiX = 3;
      float ppiY = 4;
    }

    optional bool snapToGrid = 6;
    optional float volume = 7;
  }
}

message FogLayer {
  string id = 1;
  string name = 3;
  bool visible = 4;
  Layer.LayerType type = 5;

  repeated LightSource lightSources = 6;
  message LightSource {
    Vector2d position = 1;
    float brightLightDistance = 2;
    float dimLightDistance = 3;
    Color color = 4;

    message Color {
      uint32 r = 1;
      uint32 g = 2;
      uint32 b = 3;
      uint32 a = 4;
    }
  }

  repeated Polygon obstructionPolygons = 7;
  repeated Polygon fogPolygons = 8;
  repeated Polygon fogClearPolygons = 9;
  message Polygon {
    PolygonType type = 1;
    enum PolygonType {
      FOG = 0;
      FOG_CLEAR = 1;
      LIGHT_OBSTRUCTION = 2;
    }

    repeated Vector2d verticies = 2;
    bool visibleOnTable = 3;
  }
}

message EffectsLayer {
  string id = 1;
  string name = 3;
  bool visible = 4;
  Layer.LayerType type = 5;

  repeated Effect effects = 6;
}

message Effect {
  oneof effectType {
    RainEffect rain = 1;
    EmbersEffect embers = 2;
    CloudEffect cloud = 3;
    WallOfFireEffect wallOfFire = 4;
  }
}

message RainEffect {
  reserved 10;

  string id = 1;
  string name = 2;
  bool visible = 3;
  repeated Vector2d vertices = 4;
  uint32 seed = 5;
  Color color = 6;
  double opacity = 7;
  double density = 8;
  double speed = 9;
  double dropSize = 11;

  message Color {
    uint32 r = 1;
    uint32 g = 2;
    uint32 b = 3;
  }
}

message EmbersEffect {
  string id = 1;
  string name = 2;
  bool visible = 3;
  repeated Vector2d vertices = 4;
  uint32 seed = 5;
  Color color = 6;
  double opacity = 7;
  double density = 8;
  double speed = 9;
  double particleSize = 10;

  message Color {
    uint32 r = 1;
    uint32 g = 2;
    uint32 b = 3;
  }
}

message CloudEffect {
  string id = 1;
  string name = 2;
  bool visible = 3;
  repeated Vector2d vertices = 4;
  uint32 seed = 5;
  Color color = 6;
  double opacity = 7;
  double coverage = 8;
  double speed = 9;
  double scale = 10;
  double turbulence = 11;

  message Color {
    uint32 r = 1;
    uint32 g = 2;
    uint32 b = 3;
  }
}

message WallOfFireEffect {
  reserved 11, 12;

  string id = 1;
  string name = 2;
  bool visible = 3;
  repeated Vector2d vertices = 4;
  uint32 seed = 5;
  Color color = 6;
  double opacity = 7;
  double width = 8;
  double intensity = 9;
  double speed = 10;
  double turbulence = 13;

  message Color {
    uint32 r = 1;
    uint32 g = 2;
    uint32 b = 3;
  }
}

message SceneExport {
  Scene scene = 1;
  repeated File files = 2;
  message File {
    string id = 1;
    bytes payload = 2;
    string mediaType = 3;
  }
}
